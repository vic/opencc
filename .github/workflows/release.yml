name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # linux only: the peer socket code uses SO_PEERCRED
      - name: build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o opencc ./cmd/opencc
          tar czf "opencc-${{ github.event.release.tag_name }}-linux-${{ matrix.goarch }}.tar.gz" opencc README.md
          sha256sum opencc-*.tar.gz > "opencc-${{ github.event.release.tag_name }}-linux-${{ matrix.goarch }}.tar.gz.sha256"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" opencc-*.tar.gz opencc-*.sha256 --clobber
